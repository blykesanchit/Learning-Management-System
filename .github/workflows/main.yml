name: Deploy to EC2

on:
  push:
    branches:
      - '**'  # triggers on all branches

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repo (needed to use SSH deploy)
      - name: Check out code
        uses: actions/checkout@v3

      # Step 2: Deploy via SSH
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Learning-Management-System-Backend

            # First-time deploy: clone repo if it doesn't exist
            if [ ! -d ".git" ]; then
              git clone git@github.com:blykesanchit/Learning-Management-System-Backend.git .
            fi

            # Force local branch to match remote
            git fetch origin main
            git reset --hard origin/main

            # Install/update dependencies
            npm install

            # Start or restart PM2 process
            pm2 describe server || pm2 start server.js --name server
            pm2 restart server

            # Optional: show logs for debugging
            # pm2 logs server --lines 20
